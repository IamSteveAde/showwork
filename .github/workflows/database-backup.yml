name: Daily Database Backup
on:
  schedule:
    # Runs daily at 03:00 UTC — adjust the hour if you'd rather it run
    # at a different time. Runs entirely on GitHub's own servers, so
    # this works regardless of whether any local machine is on.
    - cron: "0 3 * * *"
  # Lets you trigger a backup manually from the Actions tab any time,
  # without waiting for the schedule.
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17 (matching Supabase's server version)
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
        # The azure-cli/microsoft-prod repos are pre-configured on
        # GitHub's runners by default and unrelated to this workflow —
        # they occasionally return 403, which fails the whole
        # apt-get update even though the actual repo we need
        # (PostgreSQL's) fetches successfully. Removing them first
        # avoids that failure entirely, since we never need them.
      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          echo "BACKUP_FILE=backup_${TIMESTAMP}.sql" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$DIRECT_URL" > "backup_${TIMESTAMP}.sql"
        # The plain "pg_dump" command still resolves to the older v16
        # binary the runner already had pre-installed, since both
        # versions end up installed side by side and PATH picks the
        # first one it finds — calling the v17 binary by its exact,
        # full path sidesteps that ambiguity entirely.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET_NAME}/database-backups/${BACKUP_FILE}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      # Keeps storage bounded — deletes any backup older than 30 days,
      # so this runs forever without needing manual cleanup.
      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          CUTOFF=$(date -d "30 days ago" +%Y-%m-%d)
          aws s3 ls "s3://${R2_BUCKET_NAME}/database-backups/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" | \
          while read -r line; do
            FILE_DATE=$(echo "$line" | awk '{print $1}')
            FILE_NAME=$(echo "$line" | awk '{print $4}')
            if [[ "$FILE_DATE" < "$CUTOFF" && -n "$FILE_NAME" ]]; then
              echo "Deleting old backup: $FILE_NAME"
              aws s3 rm "s3://${R2_BUCKET_NAME}/database-backups/${FILE_NAME}" \
                --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            fi
          done
      # Fires only if any step above actually failed — sends a direct
      # email so a silent failure (an expired secret, a repo issue,
      # anything) doesn't just sit unnoticed in the Actions tab.
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{
              "from": "Showwork Backups <hello@useshowwork.com>",
              "to": "hello@useshowwork.com",
              "subject": "Daily database backup failed",
              "html": "<p>Todays scheduled database backup did not complete successfully. Check the Actions tab for details: <a href=\"https://github.com/IamSteveAde/showwork/actions\">github.com/IamSteveAde/showwork/actions</a></p>"
            }'