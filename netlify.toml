[functions."___netlify-server-handler"]
  included_files = [".media-bin/*.gz", "!node_modules/ffprobe-static/bin/**", "!node_modules/ffmpeg-static/ffmpeg", "!node_modules/ffmpeg-static/ffmpeg.exe"]

[functions."publish-post-background"]
  included_files = [".media-bin/*.gz", "!node_modules/ffprobe-static/bin/**", "!node_modules/ffmpeg-static/ffmpeg", "!node_modules/ffmpeg-static/ffmpeg.exe"]

# The consolidated cron now accesses Prisma directly (outside Next.js tracing).
[functions."social-publish-cron"]
  included_files = ["node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node"]
