# Intended VPS release: all background and scheduled functions run in the BullMQ worker service.
# Netlify builds and hosts only the Next.js web application.

[functions."___netlify-server-handler"]
  included_files = [".media-bin/*.gz", "!node_modules/ffprobe-static/bin/**", "!node_modules/ffmpeg-static/ffmpeg", "!node_modules/ffmpeg-static/ffmpeg.exe"]
